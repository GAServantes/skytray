name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 shellcheck nodejs
      - name: Lint
        run: |
          python3 -m py_compile skytray.py
          shellcheck install.sh
          for f in ui/*.js; do node --check "$f"; done
